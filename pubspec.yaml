name: totum_app
description: Application Totum – Suivi nutrition et bien-être
publish_to: 'none'

version: 1.1.10+21

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  intl: ^0.19.0

  # État & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.8.1

  # Graphiques et affichage
  fl_chart: ^0.66.2

  # Backend & authentification
  supabase_flutter: ^2.6.0
  in_app_purchase: ^3.1.11

  # Autres utilitaires Flutter
  cupertino_icons: ^1.0.8

  http: ^1.2.0           # pour appeler les API USDA + Open Food Facts
  mobile_scanner: ^5.0.0 # pour scanner les codes-barres avec la caméra


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/Logo_vierge.jpg"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/foods.csv
    - assets/logo.png
    - assets/icons/google.png
    - assets/icons/apple.png
    - assets/icons/apple_white.png
    - assets/advices.json
